name: Fastrill Cron Jobs

on:
  schedule:
    - cron: '0 2 * * *'  # 7:30 AM IST (2:00 AM UTC) — reminders
    - cron: '0 4 * * *'  # 9:30 AM IST (4:00 AM UTC) — lead recovery
  workflow_dispatch:      # manual trigger for testing

jobs:
  appointment-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger appointment reminders
        run: |
          curl -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://fastrill.com/api/cron/appointment-reminders"

  lead-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger lead recovery
        run: |
          curl -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://fastrill.com/api/cron/lead-recovery"
